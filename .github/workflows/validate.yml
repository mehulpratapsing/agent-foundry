name: Validate toolkit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the verified OpenCode CLI
        run: npm install --global opencode-ai@1.19.3
      - name: Verify generated adapters
        run: python scripts/generate_adapters.py --check
      - name: Run static verification
        run: python scripts/verify_toolkit.py --static
      - name: Verify OpenCode config and profiles
        run: python scripts/verify_toolkit.py --opencode
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
