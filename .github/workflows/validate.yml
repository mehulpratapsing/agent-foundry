name: Validate toolkit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify generated adapters
        run: python scripts/generate_adapters.py --check
      - name: Run static verification
        run: python scripts/verify_toolkit.py --static
      - name: Verify OpenCode config and profiles
        run: python scripts/verify_toolkit.py --opencode
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
